<!DOCTYPE html>
<html>
<head>
    <title>FAST STEER</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; overflow: hidden; }
        #wheel { width: 300px; height: 300px; border: 10px solid #0f0; border-radius: 50%; margin: 50px auto; position: relative; transition: transform 0.02s linear; }
        #marker { width: 10px; height: 50px; background: #f00; position: absolute; top: 0; left: 145px; }
        h1 { font-size: 80px; margin: 0; }
        button { padding: 20px; font-size: 20px; background: #0f0; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="wheel"><div id="marker"></div></div>
    <h1 id="val">0.0°</h1>
    <button onclick="conn()">CONNETTI VOLANTE</button>
    <p id="stat">DISCONNESSO</p>

    <script>
        let tare = 0;
        let lastRaw = 0;

        async function conn() {
            try {
                const dev = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Steering_Fast' }],
                    optionalServices: [0x181A]
                });
                const server = await dev.gatt.connect();
                const service = await server.getPrimaryService(0x181A);
                const char = await service.getCharacteristic(0x2A6E);
                
                await char.startNotifications();
                char.addEventListener('characteristicvaluechanged', e => {
                    let v = e.target.value.getInt16(0, true) / 100;
                    lastRaw = v;
                    let final = v - tare;
                    document.getElementById('val').innerText = final.toFixed(1) + "°";
                    document.getElementById('wheel').style.transform = `rotate(${final}deg)`;
                });
                document.getElementById('stat').innerText = "CONNESSO";
            } catch (err) { alert(err); }
        }
        
        window.addEventListener('keydown', e => { if(e.code === 'Space') tare = lastRaw; });
    </script>
</body>
</html>
