<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steering Sensor Dashboard</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .dashboard {
            text-align: center;
            background: #2d2d2d;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 300px;
        }
        .wheel-container {
            width: 200px;
            height: 200px;
            border: 10px solid #00e5ff;
            border-radius: 50%;
            margin: 30px auto;
            position: relative;
            /* La transizione rende il movimento burro anche se saltano dei dati */
            transition: transform 0.05s ease-out; 
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.2);
        }
        .wheel-line {
            width: 10px;
            height: 100px;
            background: #00e5ff;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
        }
        h1 { font-size: 3.5em; margin: 10px 0; color: #00e5ff; }
        button {
            background: #00e5ff;
            color: #1a1a1a;
            border: none;
            padding: 12px 24px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #00b3cc; }
        #status { color: #aaaaaa; font-size: 0.9em; margin-top: 15px; }
        #debug { color: #555555; font-size: 0.8em; margin-top: 5px; font-family: monospace; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>Steering Sensor</h2>
        <div class="wheel-container" id="wheel">
            <div class="wheel-line"></div>
        </div>
        <h1 id="angleDisplay">0.0°</h1>
        
        <div>
            <button onclick="connectBLE()">Connetti</button>
            <button onclick="setTare()">Tara (0°)</button>
        </div>
        <div id="status">Stato: Disconnesso</div>
        <div id="debug">In attesa di dati...</div>
    </div>

    <script>
        let bluetoothDevice;
        let characteristic;
        let tareOffset = 0;
        let currentRawAngle = 0;

        async function connectBLE() {
            try {
                document.getElementById('status').innerText = "Stato: Ricerca in corso...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Steering Sensor' }],
                    optionalServices: [0x181A]
                });

                document.getElementById('status').innerText = "Stato: Connessione al dispositivo...";
                const server = await bluetoothDevice.gatt.connect();
                
                const service = await server.getPrimaryService(0x181A);
                characteristic = await service.getCharacteristic(0x2A6E);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                document.getElementById('status').innerText = "Stato: Connesso! 🟢";
                document.getElementById('status').style.color = "#00e5ff";
                
                // Gestione disconnessione improvvisa
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Errore: " + error.message;
                document.getElementById('status').style.color = "#ff4444";
            }
        }

        function onDisconnected() {
            document.getElementById('status').innerText = "Stato: Disconnesso 🔴";
            document.getElementById('status').style.color = "#ff4444";
        }

        function handleData(event) {
            const data = event.target.value;
            // Estrae i due byte inviati dall'ESP32 e li divide per 100
            currentRawAngle = data.getInt16(0, true) / 100.0;
            
            // Debug testuale per capire se i dati arrivano
            document.getElementById('debug').innerText = "Raw BLE: " + currentRawAngle.toFixed(2);
            
            // Applica la tara
            let displayAngle = currentRawAngle - tareOffset;
            
            // Aggiorna l'interfaccia (Testo + Rotazione CSS)
            document.getElementById('angleDisplay').innerText = displayAngle.toFixed(1) + "°";
            document.getElementById('wheel').style.transform = `rotate(${displayAngle}deg)`;
        }

        function setTare() {
            tareOffset = currentRawAngle;
        }
    </script>

</body>
</html>
